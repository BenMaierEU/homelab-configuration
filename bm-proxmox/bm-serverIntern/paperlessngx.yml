version: "3.4"
services:
  broker:
    image: docker.io/library/redis:6.0
    networks:
      - paperless_network
    restart: unless-stopped
    volumes:
      - /portainer/Files/AppData/Config/paperless-ngx/redis/data:/data

  webserver:
    image: ghcr.io/paperless-ngx/paperless-ngx:latest
    restart: unless-stopped
    depends_on:
      - broker
    ports:
      - 8010:8000
    healthcheck:
      test: ["CMD", "curl", "-fs", "-S", "--max-time", "2", "http://localhost:8000"]
      interval: 30s
      timeout: 10s
      retries: 5
    environment:
      PAPERLESS_REDIS: redis://broker:6379
      USERMAP_UID: 1000
      USERMAP_GID: ${PGID}
      PAPERLESS_TIME_ZONE: Europe/Berlin
      PAPERLESS_URL: 
      PAPERLESS_SECRET_KEY:deu+eng
      PAPERLESS_OCR_LANGUAGE: deu+eng
      PAPERLESS_ADMIN_USER: ben
    env_file:
      - ./volume1/docker/secrets/paperlessngx.env

    networks:
      - paperless_network
    volumes:
      - /volume1/docker/paperless-ngx/data:/usr/src/paperless/data
      - /volume1/docker/paperless-ngx/media:/usr/src/paperless/media
      - /volume1/docker/paperless-ngx/export:/usr/src/paperless/export
      - /volume1/docker/paperless-ngx/consume:/usr/src/paperless/consume
networks:
  paperless_network:
